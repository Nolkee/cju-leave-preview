<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <title>请假申请</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=13">
  <link rel="icon" href="/favicon.ico?v=13" sizes="16x16 32x32 48x48">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="bar-inner">
      <a href="#records" class="brand"><span class="brand-mark" aria-hidden="true">假</span>请假申请</a>
    </div>
    <div class="mobile-bar">
      <div class="mobile-nav">
        <a id="mobile-back" href="#records" aria-label="返回"><span aria-hidden="true"></span></a>
        <button id="mobile-close" type="button" aria-label="关闭"><span aria-hidden="true">×</span></button>
      </div>
      <button id="mobile-title" type="button" aria-label="再次查看使用帮助"></button>
      <details id="top-options" class="top-options">
        <summary aria-label="更多操作"><span aria-hidden="true">⋯</span></summary>
        <div class="top-option-list" id="top-option-list"></div>
      </details>
    </div>
    <div id="title-hint" class="title-hint" hidden>点「请假申请」可再次查看使用帮助<br><span class="title-hint-note">（仅前三次提醒）</span></div>
    <div id="top-hint" class="top-hint" hidden>点右上角「⋯」可以编辑具体假条<br><span class="title-hint-note">（仅前三次提醒）</span></div>
  </header>
  <div class="float-nav">
    <a href="#records" class="float-nav-btn">返回</a>
    <button type="button" class="float-nav-btn">首页</button>
  </div>
  <div id="guide" class="guide" hidden>
    <div id="guide-ring" class="guide-ring"></div>
    <div id="guide-tip" class="guide-tip"><p id="guide-text"></p><button type="button" class="btn" id="guide-skip">跳过引导</button></div>
  </div>
  <main id="screen"></main>
  <dialog id="modal" aria-labelledby="dialog-title"></dialog>
  <div id="toast" role="status" aria-live="polite" popover="manual"></div>
  <canvas id="confetti" popover="manual" aria-hidden="true"></canvas>
</body>
</html>
