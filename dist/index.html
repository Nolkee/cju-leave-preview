<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>请假申请</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=13">
  <link rel="icon" href="/favicon.ico?v=13" sizes="16x16 32x32 48x48">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="style.css?v=23">
  <script>
  // 双线路智能切换：Vercel 优先，Netlify 兜底（兼容 Pxxl）
  // 只在非 Vercel 域名上运行（Netlify 的 *.netlify.app，也兼容 Pxxl 的 *.pxxlspace.cv）。
  // 在 Vercel 本身、localhost 预览时直接跳过，不做探测。
  // 逻辑：用一张 Vercel 的 favicon 图片试探 Vercel 通不通，
  // 通就跳到 Vercel（保留 hash，如 #records），不通或超时就留在当前站正常显示。
  // 上次结果记在 localStorage，12 小时内上次走兜底站就直接留，不再等 3 秒。
  // 手动强制：?route=vercel 直接去 Vercel，?route=netlify（或 ?route=pxxl）强制留当前站。
  (function () {
    try {
      var VERCEL_HOST = 'cju-leave-demo.vercel.app';
      var VERCEL_BASE = 'https://' + VERCEL_HOST + '/';
      var host = location.hostname || '';
      if (!host || host === 'localhost' || host === '127.0.0.1') return;
      if (host === VERCEL_HOST || host.endsWith('.vercel.app')) return;
      var params = new URLSearchParams(location.search || '');
      var force = params.get('route');
      function cleanSearch() {
        var sp = new URLSearchParams(location.search || '');
        sp.delete('route');
        var qs = sp.toString();
        return qs ? '?' + qs : '';
      }
      function targetUrl() {
        var t = VERCEL_BASE;
        if (location.pathname && location.pathname !== '/') t += location.pathname.replace(/^\//, '');
        t += cleanSearch();
        if (location.hash) t += location.hash;
        return t;
      }
      if (force === 'pxxl' || force === 'netlify' || force === 'fallback') return;
      if (force === 'vercel') { location.replace(targetUrl()); return; }
      var KEY = 'cju-leave-route-v1';
      var TTL = 12 * 60 * 60 * 1000;
      var cached = null;
      try { cached = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
      var now = Date.now();
      if (cached && (cached.dest === 'pxxl' || cached.dest === 'netlify' || cached.dest === 'fallback') && now - (cached.at || 0) < TTL) return;
      var timeoutMs = (cached && cached.dest === 'vercel') ? 1500 : 3000;
      var done = false;
      function stay() {
        if (done) return; done = true;
        try { localStorage.setItem(KEY, JSON.stringify({ dest: 'fallback', at: Date.now() })); } catch (e) {}
      }
      function go() {
        if (done) return; done = true;
        try { localStorage.setItem(KEY, JSON.stringify({ dest: 'vercel', at: Date.now() })); } catch (e) {}
        location.replace(targetUrl());
      }
      var img = new Image();
      var timer = setTimeout(stay, timeoutMs);
      img.onload = function () { clearTimeout(timer); go(); };
      img.onerror = function () { clearTimeout(timer); stay(); };
      img.src = VERCEL_BASE + 'favicon.ico?v=13&_t=' + now;
    } catch (e) {}
  })();
  </script>
  <script src="app.js?v=23" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="bar-inner">
      <a href="#records" class="brand"><span class="brand-mark" aria-hidden="true">假</span>请假申请</a>
    </div>
    <div class="mobile-bar">
      <div class="mobile-nav">
        <a id="mobile-back" href="#records" aria-label="返回"><span aria-hidden="true"></span></a>
        <button id="mobile-close" type="button" aria-label="关闭"><span aria-hidden="true">×</span></button>
      </div>
      <button id="mobile-title" type="button" aria-label="再次查看使用帮助"></button>
    </div>
    <div id="title-hint" class="title-hint" hidden>点「请假申请」可再次查看使用帮助<br><span class="title-hint-note">（仅前三次提醒）</span></div>
  </header>
  <main id="screen"></main>
  <dialog id="modal" aria-labelledby="dialog-title"></dialog>
  <div id="toast" role="status" aria-live="polite" popover="manual"></div>
</body>
</html>
